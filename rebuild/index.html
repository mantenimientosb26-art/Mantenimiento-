<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123d2d"><title>Mantenimiento SB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b22;background:#f3f6f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{background:#123d2d;color:white;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:20px}main{max-width:1120px;margin:auto;padding:20px 16px 60px}.muted{color:#64746b}.card{background:white;border:1px solid #dce5de;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #143b2409}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{font-size:28px;font-weight:750}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button,button{background:#176344;color:white;border:0;border-radius:9px;padding:11px 14px;font:inherit;font-weight:650;cursor:pointer}.nav button.secondary,button.secondary{background:#e4eee7;color:#174b38}.nav button.active{background:#123d2d}.nav button:disabled,button:disabled{opacity:.5}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,select,textarea{font:inherit;color:inherit;background:white;border:1px solid #cbd8ce;border-radius:8px;padding:11px;width:100%;min-width:0}textarea{min-height:85px}form .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.listitem{padding:14px 0;border-bottom:1px solid #e5ece7}.listitem:last-child{border-bottom:0}.notice{padding:12px 14px;background:#e7f3e9;border-radius:9px;margin:12px 0;white-space:pre-wrap}.notice.error{background:#fff0ee;color:#8a251d}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e7eee9;font-size:12px}.hidden{display:none!important}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e0e8e2} .tablewrap{overflow:auto}@media(max-width:600px){main{padding:12px}.card{padding:14px}header{padding:16px}}
</style></head><body>
<header><strong>Mantenimiento SB</strong><span id="userLabel">Aplicación de mantenimiento</span></header>
<main><div id="notice" class="notice">Iniciando aplicación…</div>
<section id="login" class="card hidden"><h1>Iniciar sesión</h1><p class="muted">Acceso al sistema de mantenimiento del grupo.</p><form id="loginForm"><label>Correo electrónico</label><input id="email" type="email" autocomplete="username" required><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button id="loginBtn">Entrar</button></div></form></section>
<section id="app" class="hidden"><div class="nav"><button data-view="home" class="active">Inicio</button><button data-view="sites">Locales</button><button data-view="incidents">Avisos</button><button data-view="interventions">Intervenciones</button><button data-view="reports">Informes</button><button id="logout" class="secondary">Cerrar sesión</button></div><div id="view"></div></section>
</main>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://knpvuiamdbnbrkwmoxqf.supabase.co';
const SUPABASE_KEY='sb_publishable_Q2_U354U7Wm5TSGVDH0Tiw_h0eP-nXX';
const $=id=>document.getElementById(id);
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let session=null,sites=[],equipment=[],incidents=[],maintenance=[],currentView='home',selectedSite=null,selectedEquipment=null;
function notice(msg,error=false){$('notice').textContent=msg;$('notice').className='notice'+(error?' error':'')}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString('es-ES')}
function showLogin(){ $('login').classList.remove('hidden');$('app').classList.add('hidden'); }
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=session?.user?.email||'Sesión iniciada'; }
async function query(table,cols,configure){let q=sb.from(table).select(cols);if(configure)q=configure(q);const r=await q;if(r.error)throw new Error(table+': '+r.error.message);return r.data||[]}
async function loadData(){
 notice('Cargando información…');
 try{
  const [s,e,i,m]=await Promise.all([
   query('sites','id,code,name,address,phone,active,notes',q=>q.eq('active',true).order('name')),
   query('equipment','id,site_id,name,category,brand,model,serial_number,location_detail,status,notes,photos',q=>q.order('name')),
   query('incidents','id,site_id,equipment_id,title,description,priority,status,reported_by_name,created_at,assigned_to',q=>q.order('created_at',{ascending:false}).limit(500)),
   query('equipment_maintenance_records','id,site_id,equipment_id,technician_id,maintenance_type,title,description,parts_used,cost,performed_at,follow_up_required,follow_up_notes,created_at',q=>q.order('performed_at',{ascending:false}).limit(1000))
  ]);
  sites=s;equipment=e;incidents=i;maintenance=m;
  notice('Datos cargados correctamente. '+sites.length+' locales · '+equipment.length+' equipos · '+incidents.length+' avisos · '+maintenance.length+' intervenciones.');
  render();
 }catch(err){console.error(err);notice('No se pudieron cargar todos los datos. '+err.message+'\nComprueba la sesión y los permisos de acceso.',true);$('view').innerHTML='<section class="card"><h2>No se han podido cargar los datos</h2><p>'+esc(err.message)+'</p><button id="retry">Reintentar</button></section>'}
}
function nav(view){currentView=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
function render(){
 const v=$('view');if(!v)return;
 if(currentView==='home'){v.innerHTML='<h1>Resumen general</h1><div class="grid"><article class="card"><div class="muted">Locales activos</div><div class="stat">'+sites.length+'</div></article><article class="card"><div class="muted">Equipos registrados</div><div class="stat">'+equipment.length+'</div></article><article class="card"><div class="muted">Avisos pendientes</div><div class="stat">'+incidents.filter(x=>!['resolved','closed','cancelled'].includes(x.status)).length+'</div></article><article class="card"><div class="muted">Intervenciones</div><div class="stat">'+maintenance.length+'</div></article></div><section class="card"><h2>Últimos avisos</h2>'+incidentList(incidents.slice(0,8))+'</section><section class="card"><h2>Últimas intervenciones</h2>'+maintenanceList(maintenance.slice(0,8))+'</section>';return}
 if(currentView==='sites'){v.innerHTML='<h1>Locales</h1><section class="card"><label>Buscar local</label><input id="siteSearch" placeholder="Nombre o dirección"><div id="siteList">'+siteList(sites)+'</div></section>';return}
 if(currentView==='site'){const s=sites.find(x=>x.id===selectedSite);if(!s){nav('sites');return}const eq=equipment.filter(x=>x.site_id===s.id);const ins=incidents.filter(x=>x.site_id===s.id);const ms=maintenance.filter(x=>x.site_id===s.id);v.innerHTML='<p><button class="secondary" data-view="sites">← Locales</button></p><h1>'+esc(s.name)+'</h1><p class="muted">'+esc(s.address||'Dirección pendiente')+'</p><div class="grid"><article class="card">Equipos<div class="stat">'+eq.length+'</div></article><article class="card">Avisos pendientes<div class="stat">'+ins.filter(x=>!['resolved','closed','cancelled'].includes(x.status)).length+'</div></article><article class="card">Intervenciones<div class="stat">'+ms.length+'</div></article></div><section class="card"><h2>Equipos</h2>'+equipmentList(eq)+'<h3>Añadir equipo</h3><form id="addEquipment"><div class="grid"><div><label>Nombre *</label><input name="name" required></div><div><label>Categoría</label><input name="category"></div><div><label>Marca</label><input name="brand"></div><div><label>Modelo</label><input name="model"></div><div><label>Número de serie</label><input name="serial_number"></div><div><label>Ubicación</label><input name="location_detail"></div></div><div class="actions"><button>Guardar equipo</button></div></form></section><section class="card"><h2>Avisos del local</h2>'+incidentList(ins)+'</section><section class="card"><h2>Intervenciones del local</h2>'+maintenanceList(ms)+'</section>';return}
 if(currentView==='equipment'){const e=equipment.find(x=>x.id===selectedEquipment);if(!e){nav('sites');return}const s=sites.find(x=>x.id===e.site_id);const ms=maintenance.filter(x=>x.equipment_id===e.id);v.innerHTML='<p><button class="secondary" data-view="site">← Volver al local</button></p><h1>'+esc(e.name)+'</h1><p>'+esc(s?.name||'')+' · '+esc([e.brand,e.model].filter(Boolean).join(' '))+'</p><section class="card"><h2>Ficha técnica</h2><div class="grid">'+[['Categoría',e.category],['Marca',e.brand],['Modelo',e.model],['N.º serie',e.serial_number],['Ubicación',e.location_detail],['Estado',e.status],['Observaciones',e.notes]].map(a=>'<div><small class="muted">'+a[0]+'</small><p>'+esc(a[1]||'—')+'</p></div>').join('')+'</div></section><section class="card"><h2>Historial de mantenimiento ('+ms.length+')</h2>'+maintenanceList(ms)+'<h3>Registrar intervención</h3>'+maintenanceForm(e.site_id,e.id)+'</section><section class="card"><h2>Avisos del equipo</h2>'+incidentList(incidents.filter(x=>x.equipment_id===e.id))+'</section>';return}
 if(currentView==='incidents'){v.innerHTML='<h1>Avisos y averías</h1><section class="card"><label>Filtrar por estado</label><select id="incidentFilter"><option value="">Todos</option><option value="open">Abiertos</option><option value="in_progress">En curso</option><option value="resolved">Resueltos</option><option value="closed">Cerrados</option></select><div id="incidentList">'+incidentList(incidents)+'</div></section>';return}
 if(currentView==='interventions'){v.innerHTML='<h1>Intervenciones de mantenimiento</h1><section class="card"><p class="muted">Historial centralizado de trabajos preventivos y correctivos.</p>'+maintenanceList(maintenance)+'</section>';return}
 if(currentView==='reports'){v.innerHTML='<h1>Informes</h1><section class="card"><p>Genera un informe imprimible con el estado actual de locales, equipos, avisos e intervenciones.</p><div class="actions"><button id="printReport">Generar / imprimir informe</button><button id="exportCsv" class="secondary">Exportar intervenciones CSV</button></div></section>';return}
}
function siteList(list){return list.map(s=>'<article class="listitem"><div class="row"><div><strong>'+esc(s.name)+'</strong><p class="muted">'+esc(s.address||s.code||'')+'</p><span class="pill">'+equipment.filter(e=>e.site_id===s.id).length+' equipos</span></div><button data-site="'+esc(s.id)+'">Abrir ficha</button></div></article>').join('')||'<p>No hay locales disponibles.</p>'}
function equipmentList(list){return list.map(e=>'<article class="listitem"><div class="row"><div><strong>'+esc(e.name)+'</strong><p class="muted">'+esc([e.category,e.brand,e.model].filter(Boolean).join(' · '))+'</p></div><button data-equipment="'+esc(e.id)+'">Ficha e historial</button></div></article>').join('')||'<p>No hay equipos registrados en este local.</p>'}
function incidentList(list){return list.map(x=>'<article class="listitem"><strong>'+esc(x.title)+'</strong><p>'+esc(sites.find(s=>s.id===x.site_id)?.name||'Local')+' · '+esc(equipment.find(e=>e.id===x.equipment_id)?.name||'Equipo no indicado')+'</p><p>'+esc(x.description||'')+'</p><span class="pill">'+esc(x.status||'abierto')+'</span> <span class="pill">'+esc(x.priority||'normal')+'</span> <span class="muted">'+date(x.created_at)+'</span></article>').join('')||'<p>No hay avisos.</p>'}
function maintenanceList(list){return list.map(x=>'<article class="listitem"><strong>'+esc(x.title)+'</strong><p>'+esc(sites.find(s=>s.id===x.site_id)?.name||'Local')+' · '+esc(equipment.find(e=>e.id===x.equipment_id)?.name||'Equipo')+'</p><p>'+esc(x.maintenance_type||'')+' · '+date(x.performed_at)+'</p><p>'+esc(x.description||'')+'</p><p class="muted">Repuestos: '+esc(x.parts_used||'—')+' · Coste: '+(x.cost==null?'—':esc(Number(x.cost).toLocaleString('es-ES',{style:'currency',currency:'EUR'})))+(x.follow_up_required?' · Seguimiento pendiente: '+esc(x.follow_up_notes||'Sí'):'')+'</p></article>').join('')||'<p>No hay intervenciones registradas.</p>'}
function maintenanceForm(siteId,equipmentId){return '<form id="maintenanceForm"><div class="grid"><div><label>Tipo *</label><select name="maintenance_type"><option value="breakdown">Avería</option><option value="corrective">Correctivo</option><option value="preventive">Preventivo</option><option value="inspection">Inspección</option><option value="cleaning">Limpieza</option><option value="other">Otro</option></select></div><div><label>Fecha *</label><input name="performed_at" type="datetime-local" required value="'+new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)+'"></div><div><label>Coste (€)</label><input name="cost" type="number" min="0" step="0.01"></div></div><label>Trabajo realizado *</label><input name="title" required placeholder="Título del trabajo"><label>Descripción *</label><textarea name="description" required></textarea><label>Piezas y materiales</label><textarea name="parts_used"></textarea><label><input name="follow_up_required" type="checkbox" style="width:auto"> Requiere seguimiento</label><label>Notas de seguimiento</label><textarea name="follow_up_notes"></textarea><div class="actions"><button>Guardar intervención</button></div></form>'}
document.addEventListener('click',async ev=>{
 const navBtn=ev.target.closest('[data-view]');if(navBtn){nav(navBtn.dataset.view);return}
 const sbt=ev.target.closest('[data-site]');if(sbt){selectedSite=sbt.dataset.site;nav('site');return}
 const eqb=ev.target.closest('[data-equipment]');if(eqb){selectedEquipment=eqb.dataset.equipment;nav('equipment');return}
 if(ev.target.id==='retry')loadData();
 if(ev.target.id==='logout'){await sb.auth.signOut();session=null;showLogin();notice('Sesión cerrada.');}
 if(ev.target.id==='printReport'){const w=window.open('','_blank');if(!w){notice('Permite ventanas emergentes para generar el informe.',true);return}w.document.write('<html lang="es"><head><meta charset="utf-8"><title>Informe Mantenimiento SB</title><style>body{font:14px Arial;padding:25px}h1,h2{color:#174b38}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;text-align:left;padding:6px}</style></head><body><h1>Mantenimiento SB · Informe general</h1><p>Generado: '+esc(date(new Date()))+'</p><h2>Locales</h2>'+siteTable()+'<h2>Equipos</h2>'+equipmentTable()+'<h2>Avisos</h2>'+incidentTable()+'<h2>Intervenciones</h2>'+maintenanceTable()+'</body></html>');w.document.close();w.print()}
 if(ev.target.id==='exportCsv'){const rows=[['Local','Equipo','Tipo','Título','Fecha','Descripción','Repuestos','Coste','Seguimiento'],...maintenance.map(x=>[sites.find(s=>s.id===x.site_id)?.name||'',equipment.find(e=>e.id===x.equipment_id)?.name||'',x.maintenance_type,x.title,x.performed_at,x.description,x.parts_used,x.cost,x.follow_up_notes])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='mantenimiento-sb-intervenciones.csv';a.click();URL.revokeObjectURL(a.href)}
});
function htmlTable(head,rows){return '<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function siteTable(){return htmlTable(['Local','Dirección'],sites.map(s=>[s.name,s.address||'']))}
function equipmentTable(){return htmlTable(['Local','Equipo','Categoría','Marca','Modelo','Estado'],equipment.map(e=>[sites.find(s=>s.id===e.site_id)?.name||'',e.name,e.category,e.brand,e.model,e.status]))}
function incidentTable(){return htmlTable(['Local','Aviso','Estado','Prioridad','Fecha'],incidents.map(x=>[sites.find(s=>s.id===x.site_id)?.name||'',x.title,x.status,x.priority,x.created_at]))}
function maintenanceTable(){return htmlTable(['Local','Equipo','Tipo','Trabajo','Fecha','Coste'],maintenance.map(x=>[sites.find(s=>s.id===x.site_id)?.name||'',equipment.find(e=>e.id===x.equipment_id)?.name||'',x.maintenance_type,x.title,x.performed_at,x.cost]))}
$('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const b=$('loginBtn');b.disabled=true;notice('Validando acceso…');try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;session=r.data.session;showApp();await loadData()}catch(err){notice('No se pudo iniciar sesión: '+err.message,true)}finally{b.disabled=false}});
document.addEventListener('submit',async ev=>{
 if(ev.target.id==='addEquipment'){ev.preventDefault();const f=new FormData(ev.target),data={site_id:selectedSite,name:String(f.get('name')||'').trim(),category:String(f.get('category')||'').trim()||null,brand:String(f.get('brand')||'').trim()||null,model:String(f.get('model')||'').trim()||null,serial_number:String(f.get('serial_number')||'').trim()||null,location_detail:String(f.get('location_detail')||'').trim()||null};try{const r=await sb.from('equipment').insert(data);if(r.error)throw r.error;notice('Equipo guardado.');await loadData();nav('site')}catch(err){notice('No se pudo guardar el equipo: '+err.message,true)}}
 if(ev.target.id==='maintenanceForm'){ev.preventDefault();const f=new FormData(ev.target),data={site_id:equipment.find(x=>x.id===selectedEquipment)?.site_id,equipment_id:selectedEquipment,technician_id:session.user.id,maintenance_type:f.get('maintenance_type'),title:String(f.get('title')||'').trim(),description:String(f.get('description')||'').trim(),parts_used:String(f.get('parts_used')||'').trim()||null,cost:f.get('cost')?Number(f.get('cost')):null,performed_at:new Date(f.get('performed_at')).toISOString(),follow_up_required:ev.target.querySelector('[name=follow_up_required]').checked,follow_up_notes:String(f.get('follow_up_notes')||'').trim()||null};try{const r=await sb.from('equipment_maintenance_records').insert(data);if(r.error)throw r.error;notice('Intervención guardada correctamente.');await loadData();nav('equipment')}catch(err){notice('No se pudo guardar la intervención: '+err.message,true)}}
});
document.addEventListener('input',ev=>{if(ev.target.id==='siteSearch'){$('siteList').innerHTML=siteList(sites.filter(s=>(s.name+' '+(s.address||'')).toLowerCase().includes(ev.target.value.toLowerCase())))}});
document.addEventListener('change',ev=>{if(ev.target.id==='incidentFilter'){$('incidentList').innerHTML=incidentList(incidents.filter(x=>!ev.target.value||x.status===ev.target.value))}});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.view)));
function boot(){if(!sb){notice('No se ha podido cargar el cliente de conexión. Comprueba tu conexión y recarga.',true);return}sb.auth.getSession().then(async r=>{if(r.error)throw r.error;session=r.data.session;if(!session){showLogin();notice('Inicia sesión para continuar.');return}showApp();await loadData()}).catch(e=>{showLogin();notice('Error al iniciar: '+e.message,true)})}
boot();
})();
</script></body></html>
